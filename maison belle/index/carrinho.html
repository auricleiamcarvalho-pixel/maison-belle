<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Carrinho | Maison Belle</title>

   <link rel="stylesheet" href="/css/carrinho.css">

</head>

<body onload="carregarCarrinho()">

<header>

    <h1>🛒 Meu Carrinho</h1>

    <a href="index.html" class="voltar">
        ← Continuar Comprando
    </a>

</header>

<main>

    <div id="listaCarrinho">

    </div>

    <div class="resumo">

        <h2>Total</h2>

        <h3 id="valorTotal">

            R$ 0,00

        </h3>

<div class="recompensas">
    <h2>🎁 Suas recompensas</h2>

    <p id="saldo-recompensas">Carregando moedas...</p>

    <label for="recompensa">Escolha seu desconto:</label>

    <select id="recompensa" onchange="aplicarRecompensa()">
        <option value="0">Sem desconto</option>
        <option value="10">10% — 100 moedas</option>
        <option value="15">15% — 200 moedas</option>
        <option value="20">20% — 300 moedas</option>
        <option value="25">25% — 400 moedas</option>
        <option value="30">30% — 500 moedas</option>
    </select>

    <p id="mensagem-recompensa"></p>
    <p>Desconto: <strong id="valorDesconto">R$ 0,00</strong></p>
</div>

<button class="comprar" onclick="window.location.href='checkout.html'">

Finalizar Compra

</button>

    </div>

</main>

<script src="/js/script.js"></script>

</body>

</html>
