<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Maison Belle</title>

 <link rel="stylesheet" href="/css/checkout.css">

</head>

<body>

<header class="topo">

    <h1>Maison Belle</h1>

    <p>Finalizar Compra</p>

</header>

<div class="checkout">

    <div class="formulario">

        <h2>Informações do Cliente</h2>

        <form action="pedido-confirmado.html">

            <label>Nome Completo</label>
            <input type="text" placeholder="Digite seu nome" required>

            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail" required>

            <label>Telefone</label>
            <input type="tel" placeholder="(00) 00000-0000" required>

            <label>CPF</label>
            <input type="text" placeholder="000.000.000-00" required>

            <label>CEP</label>
            <input type="text" placeholder="00000-000" required>

            <label>Estado</label>
            <input type="text" placeholder="Estado" required>

            <label>Cidade</label>
            <input type="text" placeholder="Cidade" required>

            <label>Rua</label>
            <input type="text" placeholder="Rua" required>

            <label>Número</label>
            <input type="text" placeholder="Número" required>

            <label>Complemento</label>
            <input type="text" placeholder="Apartamento, bloco, etc.">

            <h3>Forma de Pagamento</h3>

            <div class="pagamento">

                <label>
                    <input type="radio" name="pagamento" checked>
                    PIX
                </label>

                <label>
                    <input type="radio" name="pagamento">
                    Cartão de Crédito
                </label>

                <label>
                    <input type="radio" name="pagamento">
                    Boleto
                </label>

            </div>

            <button type="submit">

                Confirmar Pedido

            </button>

        </form>

    </div>

    <div class="resumo">

        <h2>Resumo do Pedido</h2>

        <div id="resumoPedido">

            Os produtos aparecerão aqui.

        </div>

        <h3>

            Total:

            <span id="totalPedido">

                R$ 0,00

            </span>

        </h3>

    </div>

</div>

<script src="/js/checkout.js"></script>

</body>

</html>
