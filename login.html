<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Maison Belle</title>

    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="painel-admin">

</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
